{% load static %}
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Play Level - My Duolingo</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* CSS สไตล์ Duolingo */
        body, html {
            height: 100%; margin: 0;
            font-family: 'Nunito', sans-serif;
            background-color: #ffffff; overscroll-behavior: none; 
        }
        .duo-layout {
            display: flex; flex-direction: column;
            height: 100vh; max-width: 600px;
            margin: 0 auto; position: relative;
        }

        .duo-header { padding: 20px; display: flex; align-items: center; }
        .progress-bar-bg {
            flex-grow: 1; height: 16px; background-color: #e5e5e5;
            border-radius: 8px; margin: 0 15px; overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%; background-color: #58cc02;
            width: 0%; border-radius: 8px; transition: width 0.3s ease;
        }

        .duo-main {
            flex-grow: 1; padding: 0 20px; display: flex;
            flex-direction: column; justify-content: center;
        }
        
        .question-title { font-size: 32px; font-weight: bold; color: #3c3c3c; margin-bottom: 5px; }
        
        

        .duo-footer {
            padding: 20px; border-top: 2px solid #e5e5e5;
            background-color: #ffffff; z-index: 20; position: relative;
        }
        .btn-check {
            width: 100%; background-color: #e5e5e5; color: #afafaf;
            border: none; border-radius: 16px; padding: 15px;
            font-size: 18px; font-weight: bold; text-transform: uppercase;
            cursor: not-allowed; transition: all 0.2s;
        }
        .btn-check.active {
            background-color: #58cc02; color: white;
            border-bottom: 4px solid #58a700; cursor: pointer;
        }
        .btn-check.active:active {
            transform: translateY(4px); border-bottom-width: 0px;
        }

        #feedback-area {
            display: none; padding: 15px; border-radius: 16px; margin-bottom: 15px; font-weight: bold;
        }
        .feedback-area.correct { background-color: #d7ffb8; color: #58a700; }
        .feedback-area.wrong { background-color: #ffdfe0; color: #ea2b2b; }
    </style>
</head>
<body>

    <script id="questions-data" type="application/json">{{ questions_json|safe }}</script>
    <script>window.LEVEL_ID = {{ level_id }};</script>

    <div class="duo-layout">
        <header class="duo-header">
            <a href="{% url 'play_home' %}" id="btn-close-page" style="text-decoration:none; font-size:24px; color:#afafaf;">✖</a>
            <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-bar"></div></div>
            <div id="progress-text" style="display:none;"></div>
            <div style="color:#ff4b4b; font-weight:bold; font-size: 18px;">❤ 5</div>
        </header>

        <main class="duo-main" id="quiz-card">
            <div id="mode-label" style="text-align: center; color: #1cb0f6; font-weight: bold; margin-bottom: 20px;"></div>

            <div style="text-align: center; margin-bottom: 30px;">
                <div id="hint-box"><div id="jp-reading" style="font-size: 18px; color: #afafaf; margin-bottom: 5px;"></div></div>
                <div class="question-title" id="jp-text">กำลังโหลดคำถาม...</div>
                <button id="btn-speak" style="display:none;">🔊</button>
            </div>
            
            <div id="mc-container"><div id="mc-grid"></div></div>

            <div id="type-container" style="display:none;"><input type="text" id="answer-input"></div>
            <div id="fill-blank-container" style="display:none;">
                <div id="fill-sentence-display"></div><div id="fill-th-hint"></div><div id="fill-word-bank"></div>
            </div>
            <div id="sort-container" style="display:none;">
                <div id="sort-prompt"><span id="sort-prompt-text"></span></div>
                <div id="sort-answer-zone"></div><div id="sort-tile-bank"></div>
            </div>
        </main>

        <div id="result-screen" style="display:none; text-align:center; padding: 40px 20px;">
            <div id="result-stars" style="font-size: 40px; margin-bottom: 10px;"></div>
            <h2 id="result-title" style="color: #ff9600; font-size: 28px;"></h2>
            <div class="score-ring"></div>
            <p style="font-size: 20px; font-weight:bold; color: #777;">คะแนน: <span id="final-score" style="color: #58cc02; font-size: 28px;"></span></p>
            <p id="result-msg" style="color: #afafaf; margin-bottom: 30px;"></p>
            
            <button id="btn-retry-game" class="btn-check active" style="margin-bottom: 15px; display:none;">ลองใหม่</button>
            <a href="{% url 'play_home' %}" id="btn-finish-game" class="btn-check active" style="text-decoration:none; display:none; box-sizing:border-box;">หน้าหลัก</a>
            
            <span id="stat-correct" style="display:none;"></span><span id="stat-wrong" style="display:none;"></span><span id="stat-total" style="display:none;"></span>
        </div>

        <footer class="duo-footer" id="action-btn-wrap">
            <div id="feedback-area">
                <span class="fb-icon"></span> <span class="fb-title"></span>
                <p class="fb-detail" style="margin: 5px 0 0 0; font-size: 16px; font-weight: normal;"></p>
            </div>
            
            <button id="btn-check" class="btn-check" disabled>ตรวจ</button>
            <button id="btn-next" class="btn-check active" style="display:none;">ถัดไป</button>
        </footer>
    </div>

    <script src="{% static 'lessons/js/play-state.js' %}"></script>
    <script src="{% static 'lessons/js/play-dom.js' %}"></script>
    <script src="{% static 'lessons/js/play-feedback.js' %}"></script>
    <script src="{% static 'lessons/js/play-renderers.js' %}"></script>
    <script src="{% static 'lessons/js/play-checkers.js' %}"></script>
    <script src="{% static 'lessons/js/play-markers.js' %}"></script>
    <script src="{% static 'lessons/js/play-helpers.js' %}"></script>
    <script src="{% static 'lessons/js/play.js' %}"></script>

</body>
</html>
